name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            bin=spools; [ "$os" = windows ] && bin=spools.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$bin" ./cmd/spools
            if [ "$os" = windows ]; then
              (cd dist && zip -q "spools_${GITHUB_REF_NAME}_${os}_${arch}.zip" "$bin" && rm "$bin")
            else
              tar -C dist -czf "dist/spools_${GITHUB_REF_NAME}_${os}_${arch}.tar.gz" "$bin" && rm "dist/$bin"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
