name: review

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [labeled]

jobs:
  review:
    if: >
      (github.event_name == 'pull_request_target' && github.event.label.name == 'mel') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       contains(github.event.comment.body, '@mel-the-caddie') &&
       github.event.comment.author_association == 'OWNER')
    runs-on: [self-hosted, reviewer]
    permissions:
      contents: read
      pull-requests: read
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.REVIEWER_APP_ID }}
          private-key: ${{ secrets.REVIEWER_PRIVATE_KEY }}

      - name: Say it's started
        id: ack
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          id=$(gh api repos/$REPO/issues/$PR/comments -f body="don't fucking touch anything, let me review this shit first." --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 0
          persist-credentials: false

      - name: Get the diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr diff $PR --repo $REPO > "$RUNNER_TEMP/pr.diff"

      - name: Review
        run: |
          claude -p "You are reviewing a pull request. The diff is at $RUNNER_TEMP/pr.diff and the checked-out code is in the current directory. Follow any review conventions in CLAUDE.md. Point out bugs, missing tests, and anything that contradicts the code around it. Be brief and specific and skip praise. Each finding goes in comments with the file path and the line number as it appears in the new version of the file; only use lines that are part of the diff. Put anything that does not fit a specific line in summary. verdict is REQUEST_CHANGES if there is a bug or broken behavior, otherwise APPROVE." \
            --allowedTools "Read,Grep,Glob" \
            --disallowedTools "Bash,Edit,Write,WebFetch,WebSearch" \
            --max-turns 30 \
            --output-format json \
            --json-schema '{"type":"object","required":["verdict","summary","comments"],"properties":{"verdict":{"type":"string","enum":["APPROVE","REQUEST_CHANGES"]},"summary":{"type":"string"},"comments":{"type":"array","items":{"type":"object","required":["path","line","body"],"properties":{"path":{"type":"string"},"line":{"type":"integer"},"body":{"type":"string"}}}}}}' \
            | jq '.structured_output // (.result | fromjson)' > "$RUNNER_TEMP/review.json"

      - name: Post review
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          jq '{event: .verdict, body: .summary, comments: [.comments[] | {path, line, body, side: "RIGHT"}]}' \
            "$RUNNER_TEMP/review.json" > "$RUNNER_TEMP/payload.json"
          if ! gh api -X POST repos/$REPO/pulls/$PR/reviews --input "$RUNNER_TEMP/payload.json" > /dev/null; then
            jq '{event: .verdict, body: (.summary + "\n\n" + ([.comments[] | "- `\(.path):\(.line)` \(.body)"] | join("\n")))}' \
              "$RUNNER_TEMP/review.json" > "$RUNNER_TEMP/payload.json"
            gh api -X POST repos/$REPO/pulls/$PR/reviews --input "$RUNNER_TEMP/payload.json" > /dev/null
          fi

      - name: Remove the placeholder
        if: success() && steps.ack.outputs.id
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api -X DELETE repos/$REPO/issues/comments/${{ steps.ack.outputs.id }}

      - name: Say it failed
        if: failure() && steps.ack.outputs.id
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh api -X PATCH repos/$REPO/issues/comments/${{ steps.ack.outputs.id }} \
            -f body="Review failed. Log: ${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}"

      - name: Remove the label
        if: always() && github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh pr edit $PR --repo $REPO --remove-label mel
